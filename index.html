<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#dcebff">
<meta name="description" content="首尔 · 釜山旅行手册：航班信息与起飞倒计时">
<title>首尔 · 釜山旅行手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f8ff; --ink:#383a5c; --muted:#666b8a; --card:#fff; --hero:#dcebff;
  --tile:#fff; --cloud:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151a2e; --ink:#eef0fb; --muted:#aab1d0; --card:#1e2540; --hero:#232c4d;
        --tile:#2a3358; --cloud:#3b4777;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px; margin:0 auto; padding:0 18px}

/* 顶部 */
.hero{
  background:var(--hero); border-radius:0 0 36px 36px;
  padding:calc(env(safe-area-inset-top,0px) + 34px) 0 32px;
}
.hero .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px}
.hero h1{margin:0; font-size:clamp(30px,9vw,42px); line-height:1.15; font-weight:800; letter-spacing:.04em}
.hero p{margin:8px 0 0; color:var(--muted); font-size:15px}
.cloud{width:104px; flex:none}

main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
h2{margin:30px 0 4px; font-size:21px; font-weight:800}
.note{margin:0 0 18px; color:var(--muted); font-size:13px}

/* 每位旅客一种糖果色 */
.pass.pink{--c:#ff8fab; --cbg:#ffe6ec}
.pass.mint{--c:#4cc9a0; --cbg:#dcf7ec}
@media (prefers-color-scheme:dark){
  .pass.pink{--cbg:#46283a}
  .pass.mint{--cbg:#21463c}
}

.pass{
  margin:0 0 24px; overflow:hidden; border:2px solid var(--c); border-radius:28px;
  background:var(--card); box-shadow:0 6px 0 var(--cbg);
}
.stub{background:var(--cbg); padding:18px 18px 20px}
.stub-h{display:flex; align-items:center; justify-content:space-between; gap:8px}
.who{
  padding:4px 15px; border-radius:999px; background:var(--c); color:#2b2d4a;
  font-size:17px; font-weight:800; letter-spacing:.06em;
}
.route{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:14px}
.plane{width:18px; height:18px; transform:rotate(90deg); flex:none}

.cd-label{margin:18px 0 10px; color:var(--muted); font-size:14px}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tile{text-align:center}
.flap{
  display:block; padding:13px 0 11px; border-radius:18px; background:var(--tile); color:var(--ink);
  font-size:clamp(28px,9vw,38px); line-height:1; font-weight:800; font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 rgba(0,0,0,.06);
}
.unit{display:block; margin-top:7px; color:var(--muted); font-size:12px}
.cd-status{margin:18px 0 0; font-size:22px; font-weight:800}

/* 航段 */
.legs{margin:0; padding:20px 18px 4px; list-style:none; border-top:2px dashed var(--c)}
.leg{padding-bottom:20px}
.leg-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px}
.fno{
  display:inline-flex; align-items:center; gap:8px; padding:5px 14px; border-radius:999px;
  background:var(--cbg); color:var(--ink); font-size:14px; text-decoration:none;
}
.fno .air{color:var(--muted)}
.fno b{font-size:15px; font-weight:800; letter-spacing:.04em}
.fno svg{width:14px; height:14px; flex:none}
.fno:hover,.fno:active{background:var(--c); color:#2b2d4a}
.fno:hover .air,.fno:active .air{color:#2b2d4a}
.fno:focus-visible{outline:3px solid var(--c); outline-offset:2px}
.date{color:var(--muted); font-size:13px; white-space:nowrap}

.row{display:grid; grid-template-columns:1fr 52px 1fr; gap:6px; align-items:start}
.end.r{text-align:right}
.place{color:var(--muted); font-size:13px}
.place b{color:var(--ink); font-size:15px; letter-spacing:.04em}
.time{font-size:30px; line-height:1.2; font-weight:800; font-variant-numeric:tabular-nums}
.next{margin-left:6px; color:var(--muted); font-size:12px; font-weight:500}
.tz{margin-top:2px; color:var(--muted); font-size:12px; line-height:1.4}
.mid{display:flex; align-items:center; gap:3px; margin-top:34px; color:var(--c)}
.mid::before,.mid::after{content:""; flex:1; border-top:2px dotted var(--c)}
.layover{
  margin:0 0 20px; padding:9px 12px; border-radius:14px;
  background:var(--cbg); color:var(--muted); font-size:13px; text-align:center;
}
.foot{margin:4px 2px 0; color:var(--muted); font-size:12.5px; line-height:1.7}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <h1>首尔 · 釜山</h1>
      <p>旅行手册，2026年10月30日出发</p>
    </div>
    <svg class="cloud" viewBox="0 0 120 80" aria-hidden="true">
      <g fill="var(--cloud)">
        <circle cx="40" cy="48" r="22"/><circle cx="68" cy="36" r="26"/><circle cx="94" cy="52" r="18"/>
        <rect x="26" y="48" width="86" height="24" rx="12"/>
      </g>
      <circle cx="58" cy="52" r="2.8" fill="var(--ink)"/><circle cx="78" cy="52" r="2.8" fill="var(--ink)"/>
      <path d="M64 58q4 4.5 8 0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="51" cy="59" r="4" fill="#ffb3c6" opacity=".8"/><circle cx="85" cy="59" r="4" fill="#ffb3c6" opacity=".8"/>
    </svg>
  </div>
</header>

<main class="wrap">
  <h2>航班</h2>
  <p class="note">所有起降时间均为机场当地时间</p>
  <div id="flights"><noscript>请开启 JavaScript 以查看航班信息和倒计时。</noscript></div>
  <p class="foot">倒计时以你设备上的时间为准，请确认手机时间已设为自动。点击航班号可在 Google 搜索该航班。</p>
</main>

<script>
(function () {
  'use strict';

  var PLANE = '<svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';
  var SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';

  /* ---------- 数据：时间 = 机场当地时间 + 该地UTC偏移，浏览器据此得到绝对时刻 ---------- */
  var TZ = {
    SYD: ['Australia/Sydney', '澳大利亚东部夏令时 AEDT (UTC+11)'],
    CN:  ['Asia/Shanghai',    '中国标准时间 CST (UTC+8)'],
    KR:  ['Asia/Seoul',       '韩国标准时间 KST (UTC+9)']
  };
  function pt(code, city, iso, z) {
    return { code: code, city: city, ts: Date.parse(iso), tz: z[0], tzName: z[1] };
  }

  // air = 页面上显示的航空公司；q = 点击后在 Google 搜索的关键词（航空公司 + 航班号）
  var TRAVELERS = [
    {
      name: 'ZZY', theme: 'pink', from: '悉尼', to: '首尔', note: '',
      legs: [{
        no: 'TW502', air: '德威航空', q: "T'way Air TW502",
        dep: pt('SYD', '悉尼',     '2026-10-30T12:15:00+11:00', TZ.SYD),
        arr: pt('ICN', '首尔仁川', '2026-10-30T20:28:00+09:00', TZ.KR)
      }]
    },
    {
      name: 'CSR', theme: 'mint', from: '昆明', to: '首尔', note: '行李直达',
      legs: [{
        no: 'FM9415', air: '上海航空', q: 'Shanghai Airlines FM9415',
        dep: pt('KMG', '昆明', '2026-10-30T11:40:00+08:00', TZ.CN),
        arr: pt('TAO', '青岛', '2026-10-30T14:55:00+08:00', TZ.CN)
      }, {
        no: 'MU2043', air: '东方航空', q: 'China Eastern MU2043',
        dep: pt('TAO', '青岛',     '2026-10-30T17:55:00+08:00', TZ.CN),
        arr: pt('ICN', '首尔仁川', '2026-10-30T20:40:00+09:00', TZ.KR)
      }]
    }
  ];

  /* ---------- 显示：始终按机场所在时区格式化，与设备时区无关 ---------- */
  var fc = {};
  function fmt(tz, kind) {
    var k = tz + kind;
    return fc[k] || (fc[k] = new Intl.DateTimeFormat('zh-CN', kind === 't'
      ? { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }
      : { timeZone: tz, month: 'long', day: 'numeric', weekday: 'short' }));
  }
  function dur(ms) {
    var m = Math.round(ms / 60000), h = Math.floor(m / 60), r = m % 60;
    return (h ? h + '小时' : '') + (r ? r + '分钟' : '');
  }
  function end(p, right, depDate) {
    var d = fmt(p.tz, 'd').format(p.ts);
    var next = right && d !== depDate ? '<span class="next">' + d + '</span>' : '';
    return '<div class="end' + (right ? ' r' : '') + '">' +
      '<div class="place"><b>' + p.code + '</b> ' + p.city + '</div>' +
      '<div class="time">' + fmt(p.tz, 't').format(p.ts) + next + '</div>' +
      '<div class="tz">' + p.tzName + '</div></div>';
  }
  function legHTML(l) {
    var d = fmt(l.dep.tz, 'd').format(l.dep.ts);
    return '<li class="leg"><div class="leg-h">' +
      '<a class="fno" href="https://www.google.com/search?q=' + encodeURIComponent(l.q) +
      '" target="_blank" rel="noopener noreferrer">' +
      '<span class="air">' + l.air + '</span><b>' + l.no + '</b>' + SEARCH + '</a>' +
      '<span class="date">' + d + '</span></div>' +
      '<div class="row">' + end(l.dep, false, d) + '<div class="mid">' + PLANE + '</div>' + end(l.arr, true, d) + '</div></li>';
  }
  function cardHTML(t) {
    var legs = t.legs.map(function (l, i) {
      var gap = '';
      if (i > 0) {
        gap = '<li class="layover">' + t.legs[i - 1].arr.city + '中转，停留' +
          dur(l.dep.ts - t.legs[i - 1].arr.ts) + (t.note ? '，' + t.note : '') + '</li>';
      }
      return gap + legHTML(l);
    }).join('');
    return '<article class="pass ' + t.theme + '"><div class="stub">' +
      '<div class="stub-h"><span class="who">' + t.name + '</span>' +
      '<span class="route">' + t.from + PLANE + t.to + '</span></div>' +
      '<p class="cd-label" data-label></p>' +
      '<div class="tiles" role="timer" data-tiles>' +
      ['天', '时', '分', '秒'].map(function (u) {
        return '<div class="tile"><span class="flap" data-u>00</span><span class="unit">' + u + '</span></div>';
      }).join('') + '</div>' +
      '<p class="cd-status" data-status hidden></p></div>' +
      '<ul class="legs">' + legs + '</ul></article>';
  }

  var root = document.getElementById('flights');
  root.innerHTML = TRAVELERS.map(cardHTML).join('');
  TRAVELERS.forEach(function (t, i) {
    var el = root.children[i];
    t.label = el.querySelector('[data-label]');
    t.tiles = el.querySelector('[data-tiles]');
    t.status = el.querySelector('[data-status]');
    t.nums = el.querySelectorAll('[data-u]');
  });

  /* ---------- 倒计时 ----------
     1. 读取设备当前时间 Date.now()
     2. 起飞时间（机场当地时间+时区）换算成设备时区的对应时刻 L[i].dep.ts
     3. 两者相减，页面只显示结果，不显示换算过程 */
  function update() {
    var now = Date.now();
    TRAVELERS.forEach(function (t) {
      var L = t.legs, target = 0, label = '', status = '', i;
      if (now < L[0].dep.ts) {
        target = L[0].dep.ts; label = '距离起飞';
      } else {
        var done = true;
        for (i = 0; i < L.length; i++) {
          if (now < L[i].arr.ts) {
            status = L.length > 1 ? '第' + (i + 1) + '程飞行中' : '飞行中';
            done = false; break;
          }
          if (i < L.length - 1 && now < L[i + 1].dep.ts) {
            target = L[i + 1].dep.ts; label = '中转中，距离第' + (i + 2) + '程起飞';
            done = false; break;
          }
        }
        if (done) status = '已抵达' + t.to;
      }
      t.tiles.hidden = t.label.hidden = !target;
      t.status.hidden = !status;
      if (status) t.status.textContent = status;
      if (target) {
        t.label.textContent = label;
        var s = Math.max(0, Math.ceil((target - now) / 1000));
        var v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
        for (i = 0; i < 4; i++) {
          var x = String(v[i]).padStart(2, '0');
          if (t.nums[i].textContent !== x) t.nums[i].textContent = x;
        }
      }
    });
  }
  (function loop() {
    update();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 20); // 对齐整秒
  })();
  document.addEventListener('visibilitychange', update);

  /* ---------- 离线支持 ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
